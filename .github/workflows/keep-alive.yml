name: Keep Supabase Alive

on:
  schedule:
    # Runs at 12:00 UTC every 3 days.
    - cron: '0 12 */3 * *'
  # Allows manual testing of the workflow
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase app
        run: |
          curl -s -f https://car-showcase-peach-xi.vercel.app/ || echo "Ping falhou ou retornou um erro não-200. Certifique-se de verificar o log."
